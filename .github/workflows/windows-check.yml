name: Windows check
on:
  push:
    branches: [ci-windows-check]
jobs:
  test:
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_linux_checks: false
      enable_macos_checks: false
      enable_windows_checks: true
      windows_build_timeout: 180
      windows_swift_versions: '["nightly-6.4.x"]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_build_command: 'Invoke-Program swift run -Xlinker /ignore:4217 --configuration release swift-build --build-tests --scratch-path .tests; Invoke-Program swift run -Xlinker /ignore:4217 --configuration release swift-test --skip-build --scratch-path .tests --filter "SourceControlTests.GitRepositoryTests/testRawRepository"'
