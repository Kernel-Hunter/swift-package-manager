name: Windows fixed (fork only)
on:
  push:
    branches: [ci-windows-fixed]
jobs:
  test:
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_linux_checks: false
      enable_macos_checks: false
      enable_windows_checks: true
      windows_build_timeout: 240
      windows_swift_versions: '["nightly-6.4.x"]'
      windows_pre_build_command: 'Invoke-Program .\.github\scripts\prebuild.ps1'
      windows_build_command: 'Invoke-Program swift run -Xlinker /ignore:4217 --configuration release swift-build --build-tests --scratch-path .tests; foreach ($i in 1..3) { foreach ($f in @("VFSTests", "PrepareForIndexTests", "RegistryPackageContainerTests", "PackageCollectionsStorageTests/testFileCorrupt", "ManifestSourceGenerationTests/testPackageDependencyVariations")) { Write-Host "===== FILTER $f (round $i)"; swift run -Xlinker /ignore:4217 --configuration release swift-test --skip-build --scratch-path .tests --filter $f; Write-Host "===== EXIT $f (round $i) $LASTEXITCODE" } }'
